title: Example - Legendary AAA Game
separator: "_"
illegal: ["%.", ":", "*", "?", "!", "=", "+", "@", "#", "<", ">", "|", "\\", "/", '\"', "'", "%%", "%^", "%$", "%[", "]", "{", "}"]
find: ["%s+"]
replace: "_"
notesmode: All
fields:
  - field: Category
    value: [Ambience, Interactable, Environmental, Cinematic, 'Non-Player Character', 'User Interface', Player]
    short: [AMB, INT, ENV, CIN, NPC, UI, PLR]
    capitalization: Title
    help: Categories to group sounds. To add more categories to this dropdown open the .yaml and add a value and short pair.
    fields:
      - id: ['Player', 'Non-Player Character']
        field: Weapon
        value: ''
        note: "Target Loudness: -8 LUFS-M"
      - id: [Ambience, Interactable, Environmental]
        field: Level
        value: ''
        note: "Target Loudness: -37 LUFS-M"
        fields:
          - field: Sub Level
            value: ''
            note: "Folder: /Originals/Level_SubLevel/"
      - id: [Cinematic, 'User Interface']
        field: CritPath
        value: true
        btrue: "crit"
        bfalse: "opt"
        note: "Target Loudness: -14 LUFS-M"